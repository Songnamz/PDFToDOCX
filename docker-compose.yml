# PDFToWord (ThaiDoc) — https://pdftoword.songnam.xyz
# Cloudflare Tunnel "main" -> http://localhost:8089 -> nginx -> app:8000
name: pdftoword

services:
  app:
    build: .
    image: pdftoword-app:latest
    container_name: pdftoword-app
    env_file: .env
    tmpfs:
      - /data:size=2g,uid=1000,gid=1000   # uploads/results live in RAM, vanish on restart
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pdftoword-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
